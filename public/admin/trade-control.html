<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Trade Remote Control</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e1215;
      color: #dde2e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }
    h1 { font-size: 1.15rem; color: #aab4bf; letter-spacing: 0.04em; text-transform: uppercase; }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1a2028;
      border: 1px solid #2e3740;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .hidden { display: none !important; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .label { font-size: 0.78rem; color: #7a8896; text-transform: uppercase; letter-spacing: 0.05em; }
    .value { font-size: 1rem; font-weight: 600; color: #e8edf2; }
    .value.dim { color: #556070; }
    .value.err { color: #e07070; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge.idle    { background:#252d36;color:#556070 }
    .badge.waiting { background:#1e3448;color:#5aabef }
    .badge.pricing { background:#1e3332;color:#4dd4ac }
    .badge.posted  { background:#2a2a1e;color:#d4be4d }
    .badge.money   { background:#1e2e1e;color:#6dcc6d }
    .badge.accept  { background:#2e261e;color:#e8a84d }
    .badge.complete{ background:#1e2e1e;color:#4dcc7e }
    .badge.error   { background:#2e1e1e;color:#e07070 }
    .conn-row { display:flex;align-items:center;gap:8px;font-size:0.8rem;color:#667788 }
    .dot { width:10px;height:10px;border-radius:50%;background:#3a4550;flex-shrink:0 }
    .dot.ok  { background:#3acc7e;box-shadow:0 0 6px #3acc7e88 }
    .dot.bad { background:#cc4444 }
    .btn-skip {
      width: 100%;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #c0392b;
      color: #fff;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-skip:active   { transform:scale(0.97);background:#a93226 }
    .btn-skip:disabled { background:#2e3740;color:#556070;cursor:not-allowed;transform:none }
    .btn-link {
      background: none; border: none; color: #4a6a8a;
      font-size: 0.78rem; cursor: pointer; text-decoration: underline; padding: 0;
    }
    .feedback {
      text-align: center; font-size: 0.85rem; color: #5aabef;
      min-height: 1.2em; transition: opacity 0.4s;
    }
    .updated { font-size:0.72rem;color:#445060;text-align:right }
    /* token form */
    #token-section { width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px }
    #token-section p  { font-size:0.83rem;color:#7a8896;line-height:1.5 }
    #token-section code {
      display:block;margin-top:6px;padding:8px 10px;border-radius:6px;
      background:#11161a;color:#7ecbef;font-size:0.78rem;word-break:break-all;
      border:1px solid #2a3440;user-select:all;cursor:text;
    }
    #token-section input {
      padding:14px;border-radius:10px;border:1px solid #2e3740;
      background:#1a2028;color:#dde2e8;font-size:0.95rem;width:100%;
    }
    #token-section button.primary {
      padding:14px;border-radius:10px;border:none;
      background:#1e4070;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;
    }
  </style>
</head>
<body>
  <h1>Trade Remote Control</h1>

  <!-- Token entry (shown when no token saved) -->
  <div id="token-section" class="hidden">
    <p>
      Paste your receipt token below. You can find it at the top of the
      Tampermonkey script as <strong>RECEIPT_TOKEN</strong>:
      <code>926cc7e6-5092-40cc-ba8a-a3f9b8070a6c</code>
    </p>
    <input id="token-input" type="text" placeholder="Paste token here…" autocomplete="off" spellcheck="false">
    <button class="primary" id="token-submit">Connect</button>
  </div>

  <!-- Live state card -->
  <div class="card hidden" id="state-card">
    <div class="conn-row">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-label">Connecting…</span>
      <button class="btn-link" id="btn-change-token" style="margin-left:auto">Change token</button>
    </div>
    <div class="row">
      <span class="label">Trader</span>
      <span class="value dim" id="trader-name">—</span>
    </div>
    <div class="row">
      <span class="label">Trade</span>
      <span class="value dim" id="trade-id">—</span>
    </div>
    <div class="row">
      <span class="label">Stage</span>
      <span class="badge idle" id="stage-badge">idle</span>
    </div>
    <div class="row hidden" id="error-row">
      <span class="label">Error</span>
      <span class="value err" id="trade-error"></span>
    </div>
    <div class="updated" id="updated-at">Waiting for first update…</div>
    <button class="btn-skip" id="btn-skip" disabled>Skip Trade</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const TOKEN_KEY = 'trade_ctrl_token';
    let socket = null, feedbackTimer = null, lastStateAt = 0;

    // Live "X s ago" counter
    setInterval(() => {
      if (!lastStateAt) return;
      const s = Math.round((Date.now() - lastStateAt) / 1000);
      const stale = s > 10;
      const el = document.getElementById('updated-at');
      if (el) {
        el.textContent = s < 5 ? 'Just updated' : `Last update: ${s}s ago`;
        el.style.color = stale ? '#e05555' : '#445060';
      }
    }, 1000);

    // ── token helpers ──────────────────────────────────────────────────────
    function getToken() {
      // URL param takes priority (allows bookmarking the full URL on mobile)
      const p = new URLSearchParams(location.search).get('token');
      if (p) { localStorage.setItem(TOKEN_KEY, p); return p; }
      return localStorage.getItem(TOKEN_KEY) || '';
    }

    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
    }

    // ── UI helpers ─────────────────────────────────────────────────────────
    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    function showFeedback(text, color) {
      const el = document.getElementById('feedback');
      el.style.color = color || '#5aabef';
      el.style.opacity = '1';
      el.textContent = text;
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => { el.style.opacity = '0'; }, 3500);
    }

    const STAGE_CLS = {
      idle:'idle', opening:'waiting', waiting:'waiting',
      waiting_for_items:'waiting', waiting_for_adjustment:'waiting',
      pricing:'pricing', receipt_posted:'posted', add_money:'money',
      returning:'money', thank_posted:'accept', awaiting_accept:'accept',
      complete:'complete', reopened:'waiting',
    };

    function applyState(state) {
      const stage = state.stage || 'idle';
      const nameEl = document.getElementById('trader-name');
      nameEl.textContent = state.traderName || '—';
      nameEl.className = 'value' + (state.traderName ? '' : ' dim');
      document.getElementById('trade-id').textContent = state.tradeId ? `#${state.tradeId}` : '—';
      document.getElementById('trade-id').className = 'value' + (state.tradeId ? '' : ' dim');

      const badge = document.getElementById('stage-badge');
      badge.className = 'badge ' + (STAGE_CLS[stage] || 'idle');
      badge.textContent = stage.replace(/_/g, ' ');

      const errRow = document.getElementById('error-row');
      if (state.error) {
        errRow.classList.remove('hidden');
        document.getElementById('trade-error').textContent = state.error;
      } else {
        errRow.classList.add('hidden');
      }

      lastStateAt = Date.now();

      const hasActiveTrade = !!state.tradeId && stage !== 'idle';
      const skipBtn = document.getElementById('btn-skip');
      skipBtn.disabled = !hasActiveTrade;
      skipBtn.textContent = hasActiveTrade ? 'Skip Trade' : 'No active trade';
    }

    // ── socket connection ──────────────────────────────────────────────────
    function connect(token) {
      if (socket) { socket.disconnect(); socket = null; }

      socket = io({ transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        document.getElementById('conn-dot').className = 'dot ok';
        document.getElementById('conn-label').textContent = 'Connected';
        socket.emit('trade:join', 'trade-admins', token);
      });

      socket.on('connect_error', () => {
        document.getElementById('conn-dot').className = 'dot bad';
        document.getElementById('conn-label').textContent = 'Connection failed — retrying…';
      });

      socket.on('disconnect', () => {
        document.getElementById('conn-dot').className = 'dot bad';
        document.getElementById('conn-label').textContent = 'Disconnected — reconnecting…';
        const s = document.getElementById('btn-skip');
        s.disabled = true;
        s.textContent = 'No active trade';
      });

      socket.on('trade:state', applyState);

      socket.on('trade:command-ack', (data) => {
        showFeedback('Skip command sent ✓', '#6dcc6d');
      });
    }

    // ── events ─────────────────────────────────────────────────────────────
    document.getElementById('btn-skip').addEventListener('click', () => {
      if (!socket?.connected) return;
      socket.emit('trade:command', { action: 'skip' }, getToken());
      showFeedback('Sending skip command…', '#d4be4d');
    });

    document.getElementById('token-submit').addEventListener('click', () => {
      const token = document.getElementById('token-input').value.trim();
      if (!token) return;
      localStorage.setItem(TOKEN_KEY, token);
      hide('token-section');
      show('state-card');
      connect(token);
    });

    document.getElementById('btn-change-token').addEventListener('click', () => {
      if (socket) { socket.disconnect(); socket = null; }
      clearToken();
      hide('state-card');
      hide('controls');
      document.getElementById('token-input').value = '';
      show('token-section');
    });

    // ── auto-connect ───────────────────────────────────────────────────────
    const saved = getToken();
    if (saved) {
      show('state-card');
      connect(saved);
    } else {
      show('token-section');
    }
  </script>
</body>
</html>
