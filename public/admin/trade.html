<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Listings — Torn Tracker Admin</title>
  <link rel="stylesheet" href="/admin/style.css">
  <style>
    /* ── Layout ─────────────────────────────────────────────────────────── */
    .top-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card  { padding: 1rem 1.25rem; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); font-family: var(--mono); letter-spacing: -0.02em; }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-family: var(--mono); margin-top: 0.2rem; }

    /* ── Profile card ───────────────────────────────────────────────────── */
    .profile-card { padding: 1.25rem; }
    .profile-card h2 { margin-bottom: 1rem; font-size: 0.95rem; }

    /* ── Catalog browser ────────────────────────────────────────────────── */
    .cat-browser { overflow: hidden; }
    .cat-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; flex-wrap: wrap;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--glass-border);
    }
    .cat-head-left { display: flex; align-items: center; gap: 0.75rem; }
    .cat-head-left h2 { font-size: 0.95rem; }
    .cat-sub { font-family: var(--mono); font-size: 0.68rem; color: var(--text-muted); }
    .cat-toolbar { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .cat-search {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      border-radius: 7px; padding: 0.35rem 0.7rem; color: var(--text);
      font-size: 0.8rem; font-family: var(--sans); width: 180px; outline: none;
    }
    .cat-search:focus { border-color: rgba(110,231,247,0.3); }
    .btn-save {
      background: var(--accent); color: #07080f; border: none;
      font-weight: 700; padding: 0.4rem 1.1rem; border-radius: 7px;
      font-size: 0.825rem; font-family: var(--sans); cursor: pointer;
      transition: all 0.18s;
    }
    .btn-save:hover { background: #93f0ff; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Category sections ──────────────────────────────────────────────── */
    .cat-list { max-height: 68vh; overflow-y: auto; }

    .cat-section { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .cat-section:last-child { border-bottom: none; }

    .cat-row {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.6rem 1.25rem;
      cursor: pointer; transition: background 0.14s; user-select: none;
    }
    .cat-row:hover { background: rgba(255,255,255,0.025); }

    .cat-check {
      width: 15px; height: 15px; flex-shrink: 0;
      cursor: pointer; accent-color: var(--accent);
    }
    .cat-label { font-weight: 600; font-size: 0.855rem; flex: 1; }
    .cat-tally {
      font-family: var(--mono); font-size: 0.65rem;
      color: var(--text-muted); flex-shrink: 0;
    }
    .cat-tally .listed { color: var(--accent); }

    .cat-pct-wrap {
      display: flex; align-items: center; gap: 0.35rem;
      flex-shrink: 0; font-size: 0.75rem;
    }
    .cat-pct-label { color: var(--text-muted); font-family: var(--mono); font-size: 0.65rem; }
    .cat-pct-input {
      width: 52px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 5px; padding: 0.22rem 0.4rem;
      color: var(--text); font-size: 0.78rem; font-family: var(--mono);
      text-align: right; outline: none;
    }
    .cat-pct-input:focus { border-color: rgba(110,231,247,0.4); }
    .cat-apply-btn {
      background: transparent; border: 1px solid var(--glass-border);
      border-radius: 5px; padding: 0.22rem 0.5rem;
      font-size: 0.7rem; font-family: var(--sans);
      color: var(--text-muted); cursor: pointer; transition: all 0.14s;
    }
    .cat-apply-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: rgba(110,231,247,0.3); }

    .cat-chevron {
      font-size: 0.55rem; color: var(--text-muted);
      transition: transform 0.18s; flex-shrink: 0; padding: 0.2rem;
      pointer-events: none;
    }
    .cat-section.open .cat-chevron { transform: rotate(180deg); }

    /* ── Item rows ──────────────────────────────────────────────────────── */
    .cat-items { display: none; }
    .cat-section.open .cat-items { display: block; }

    .item-row {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.38rem 1.25rem 0.38rem 2.75rem;
      border-top: 1px solid rgba(255,255,255,0.03);
      transition: background 0.12s;
    }
    .item-row:hover { background: rgba(255,255,255,0.02); }
    .item-row.unchecked { opacity: 0.38; }
    .item-row.editing { background: rgba(110,231,247,0.04); opacity: 1; }

    .item-check {
      width: 14px; height: 14px; flex-shrink: 0;
      cursor: pointer; accent-color: var(--accent);
    }
    .item-icon-xs {
      width: 22px; height: 22px; flex-shrink: 0;
      border-radius: 4px; object-fit: contain; padding: 1px;
      image-rendering: pixelated;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .item-name-col { font-size: 0.815rem; flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-price-col {
      display: flex; align-items: center; gap: 0.4rem;
      flex-shrink: 0; font-family: var(--mono); font-size: 0.75rem;
    }
    .price-tag { color: var(--accent); }
    .price-tag.none { color: var(--text-muted); font-style: italic; }
    .price-tag.inherited { color: var(--text-muted); }
    .pct-tag {
      font-size: 0.62rem; background: rgba(110,231,247,0.08);
      border: 1px solid rgba(110,231,247,0.15); border-radius: 3px;
      padding: 0.05rem 0.3rem; color: rgba(110,231,247,0.7);
    }
    .notes-tag { font-size: 0.68rem; color: var(--text-muted); max-width: 100px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-edit-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.72rem; padding: 0.2rem 0.35rem; border-radius: 4px;
      color: var(--text-muted); transition: all 0.14s; flex-shrink: 0;
    }
    .item-edit-btn:hover { background: var(--glass-hover); color: var(--text); }
    .item-edit-btn.active { background: var(--accent-dim); color: var(--accent); }

    /* ── Inline item editor ─────────────────────────────────────────────── */
    .item-editor {
      display: none;
      padding: 0.6rem 1.25rem 0.7rem 2.75rem;
      border-top: 1px solid rgba(110,231,247,0.08);
      background: rgba(110,231,247,0.03);
      flex-wrap: wrap; gap: 0.5rem; align-items: center;
    }
    .item-editor.open { display: flex; }

    .mode-toggle-sm {
      display: flex; border: 1px solid var(--glass-border);
      border-radius: 6px; overflow: hidden;
    }
    .mode-btn-sm {
      padding: 0.28rem 0.65rem; font-size: 0.75rem; font-weight: 500;
      font-family: var(--sans); background: transparent; border: none;
      border-right: 1px solid var(--glass-border);
      color: var(--text-dim); cursor: pointer; transition: all 0.14s;
    }
    .mode-btn-sm:last-child { border-right: none; }
    .mode-btn-sm.active { background: var(--accent-dim); color: var(--accent); }

    .editor-input {
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 6px; padding: 0.28rem 0.55rem; color: var(--text);
      font-size: 0.8rem; font-family: var(--mono); outline: none; width: 110px;
    }
    .editor-input:focus { border-color: rgba(110,231,247,0.4); }
    .editor-notes {
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 6px; padding: 0.28rem 0.55rem; color: var(--text);
      font-size: 0.8rem; font-family: var(--sans); outline: none; width: 160px;
    }
    .editor-notes:focus { border-color: rgba(110,231,247,0.4); }
    .editor-label { font-size: 0.7rem; color: var(--text-muted); font-family: var(--mono); }
    .editor-apply {
      background: var(--accent-dim); border: 1px solid rgba(110,231,247,0.25);
      border-radius: 6px; padding: 0.28rem 0.65rem;
      font-size: 0.75rem; color: var(--accent); cursor: pointer;
      font-family: var(--sans); transition: all 0.14s;
    }
    .editor-apply:hover { background: rgba(110,231,247,0.2); }
    .editor-clear {
      background: transparent; border: 1px solid var(--glass-border);
      border-radius: 6px; padding: 0.28rem 0.65rem;
      font-size: 0.75rem; color: var(--text-muted); cursor: pointer;
      font-family: var(--sans); transition: all 0.14s;
    }
    .editor-clear:hover { background: var(--glass-hover); }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: #1d2540; border: 1px solid var(--glass-border);
      border-radius: 10px; padding: 0.6rem 1.1rem;
      font-size: 0.825rem; color: var(--text); z-index: 1000;
      display: none; box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      font-family: var(--mono); white-space: nowrap;
    }
    #toast.show { display: block; animation: toastIn 0.2s; }
    #toast.err  { border-color: rgba(248,113,113,0.3); color: var(--error); }
    @keyframes toastIn {
      from { opacity:0; transform: translateX(-50%) translateY(8px); }
      to   { opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .top-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .cat-pct-wrap { display: none; } /* hide on very small; use per-item edit */
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand"><span class="mono accent">&gt;_</span> Torn Tracker</span>
    <div class="nav-right">
      <a href="/trade" target="_blank" class="btn btn-ghost btn-sm mobile-hide">View Listing</a>
      <a href="/admin/dashboard" class="btn btn-ghost btn-sm">Dashboard</a>
      <a href="/admin/inventory" class="btn btn-ghost btn-sm mobile-hide">Inventory</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
  </div>
</nav>

<main class="dashboard">

  <!-- Stats row -->
  <div class="stats-row">
    <div class="glass-card stat-card">
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-label">Total Listed</div>
    </div>
    <div class="glass-card stat-card">
      <div class="stat-value" id="statCats">—</div>
      <div class="stat-label">Categories</div>
    </div>
    <div class="glass-card stat-card">
      <div class="stat-value" id="statMktPct" style="color:var(--accent-2)">—</div>
      <div class="stat-label">Market % Based</div>
    </div>
    <div class="glass-card stat-card">
      <div class="stat-value" id="statFixed" style="color:var(--success)">—</div>
      <div class="stat-label">Fixed Price</div>
    </div>
  </div>

  <!-- Top grid: profile left, catalog browser right -->
  <div class="top-grid">

    <!-- Profile -->
    <div class="glass-card profile-card">
      <h2>Trader Profile</h2>
      <form id="profileForm">
        <div class="field">
          <label>Display Name</label>
          <input type="text" id="pDisplayName" placeholder="Your in-game name" required>
        </div>
        <div class="field">
          <label>Discord Handle</label>
          <input type="text" id="pDiscord" placeholder="@YourName#1234">
        </div>
        <div class="field">
          <label>Torn Profile URL</label>
          <input type="url" id="pTornUrl" placeholder="https://www.torn.com/profiles.php?XID=...">
        </div>
        <div class="field">
          <label>Bio</label>
          <textarea id="pBio" rows="2" placeholder="What you're looking for, preferences, etc."
            style="background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:8px;padding:.55rem .85rem;color:var(--text);font-size:.875rem;font-family:var(--sans);resize:vertical;outline:none;width:100%"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="saveProfileBtn">Save Profile</button>
      </form>
    </div>

    <!-- Catalog browser -->
    <div class="glass-card cat-browser">
      <div class="cat-head">
        <div class="cat-head-left">
          <h2>Item Catalog</h2>
          <span class="cat-sub" id="catalogSub">Loading…</span>
        </div>
        <div class="cat-toolbar">
          <input class="cat-search" id="catSearch" placeholder="Filter items…" autocomplete="off">
          <button class="btn btn-ghost btn-sm" id="expandAllBtn">Expand All</button>
          <button class="btn btn-ghost btn-sm" id="collapseAllBtn">Collapse</button>
          <button class="btn-save" id="saveChangesBtn" disabled>Save</button>
        </div>
      </div>
      <div class="cat-list" id="catalogBody">
        <div style="padding:2rem;text-align:center;color:var(--text-muted);font-family:var(--mono);font-size:.8rem">
          Loading item catalog…
        </div>
      </div>
    </div>

  </div>
</main>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   State
   selections: Map<torn_item_id, { checked, price_mode, market_pct, fixed_price, notes }>
   catDefaults: Map<type, { market_pct }>   — category-level default %
═══════════════════════════════════════════════════════════════ */
let catalog    = [];          // [{type, items:[...]}]
let selections = new Map();   // itemId → price state
let catDefaults= new Map();   // type   → { market_pct }
let filterQ    = '';
let openEditor = null;        // itemId whose inline editor is open

const fmt = n => n == null ? '—' : '$' + Number(n).toLocaleString();
const pctFmt = v => v == null ? '' : (v * 100).toFixed(1).replace(/\.0$/, '') + '%';

/* ── Helpers ──────────────────────────────────────────────────────────── */
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show' + (err ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2600);
}

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    const j = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(j.error || res.statusText);
  }
  return res.json();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Profile ──────────────────────────────────────────────────────────── */
async function loadProfile() {
  try {
    const p = await api('/admin/api/trade/profile');
    document.getElementById('pDisplayName').value = p.display_name || '';
    document.getElementById('pDiscord').value     = p.discord_handle || '';
    document.getElementById('pTornUrl').value     = p.torn_profile_url || '';
    document.getElementById('pBio').value         = p.bio || '';
  } catch (e) { toast('Failed to load profile: ' + e.message, true); }
}

document.getElementById('profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('saveProfileBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    await api('/admin/api/trade/profile', {
      method: 'PUT',
      body: JSON.stringify({
        display_name:     document.getElementById('pDisplayName').value,
        discord_handle:   document.getElementById('pDiscord').value,
        bio:              document.getElementById('pBio').value,
        torn_profile_url: document.getElementById('pTornUrl').value,
      }),
    });
    toast('Profile saved');
  } catch (e) { toast('Save failed: ' + e.message, true); }
  btn.textContent = 'Save Profile'; btn.disabled = false;
});

/* ── Load catalog ─────────────────────────────────────────────────────── */
async function loadCatalog() {
  try {
    catalog = await api('/admin/api/trade/all-items');

    // Init selections from existing listings
    selections.clear();
    catDefaults.clear();
    for (const { type, items } of catalog) {
      for (const item of items) {
        if (item.listing_id) {
          selections.set(item.id, {
            checked:     item.is_active !== false,
            price_mode:  item.price_mode || 'market_pct',
            market_pct:  item.market_pct,
            fixed_price: item.fixed_price,
            notes:       item.notes || '',
          });
        }
      }
    }

    // Derive category defaults from the most common market_pct in that category
    for (const { type, items } of catalog) {
      const pcts = items
        .map(i => selections.get(i.id))
        .filter(s => s && s.price_mode === 'market_pct' && s.market_pct)
        .map(s => Math.round(s.market_pct * 1000) / 10);

      if (pcts.length) {
        const freq = {};
        pcts.forEach(p => freq[p] = (freq[p] || 0) + 1);
        const dominant = Object.entries(freq).sort((a,b) => b[1]-a[1])[0][0];
        catDefaults.set(type, { market_pct: parseFloat(dominant) });
      } else {
        catDefaults.set(type, { market_pct: null });
      }
    }

    renderCatalog();
    updateStats();
    document.getElementById('saveChangesBtn').disabled = false;
  } catch (e) {
    document.getElementById('catalogBody').innerHTML =
      `<div style="padding:2rem;text-align:center;color:var(--error)">Error: ${e.message}</div>`;
  }
}

/* ── Render catalog ───────────────────────────────────────────────────── */
function renderCatalog() {
  const body = document.getElementById('catalogBody');
  body.innerHTML = '';

  const q = filterQ.toLowerCase();

  for (const { type, items } of catalog) {
    const filtered = q ? items.filter(i => i.name.toLowerCase().includes(q) || type.toLowerCase().includes(q)) : items;
    if (!filtered.length) continue;

    const listedCount = filtered.filter(i => {
      const s = selections.get(i.id);
      return s && s.checked;
    }).length;

    const catDef = catDefaults.get(type) || {};
    const pctVal = catDef.market_pct != null ? catDef.market_pct : '';

    // Determine category checkbox state
    const checkedCount = filtered.filter(i => selections.get(i.id)?.checked).length;
    const catChecked     = checkedCount === filtered.length;
    const catIndeterminate = checkedCount > 0 && checkedCount < filtered.length;

    const sec = document.createElement('div');
    sec.className = 'cat-section';
    sec.dataset.type = type;

    sec.innerHTML = `
      <div class="cat-row">
        <input type="checkbox" class="cat-check" ${catChecked ? 'checked' : ''}>
        <span class="cat-label">${esc(type)}</span>
        <span class="cat-tally">
          <span class="listed">${listedCount}</span> / ${filtered.length}
        </span>
        <div class="cat-pct-wrap" onclick="event.stopPropagation()">
          <span class="cat-pct-label">mkt%</span>
          <input type="number" class="cat-pct-input" min="1" max="300" step="1"
            value="${pctVal}" placeholder="—" title="Market % for whole category">
          <button class="cat-apply-btn">Apply all</button>
        </div>
        <span class="cat-chevron">▼</span>
      </div>
      <div class="cat-items">
        ${filtered.map(item => renderItemRow(item)).join('')}
      </div>
    `;

    // Category checkbox
    const catCheck = sec.querySelector('.cat-check');
    if (catIndeterminate) catCheck.indeterminate = true;
    catCheck.addEventListener('change', e => {
      e.stopPropagation();
      toggleCategory(type, catCheck.checked, filtered);
    });
    catCheck.addEventListener('click', e => e.stopPropagation());

    // Expand/collapse on header click
    sec.querySelector('.cat-row').addEventListener('click', e => {
      if (e.target.closest('.cat-pct-wrap') || e.target.closest('.cat-check')) return;
      sec.classList.toggle('open');
    });

    // Apply % to all items
    const applyBtn  = sec.querySelector('.cat-apply-btn');
    const pctInput  = sec.querySelector('.cat-pct-input');
    applyBtn.addEventListener('click', e => {
      e.stopPropagation();
      const v = parseFloat(pctInput.value);
      if (!v || v <= 0) { toast('Enter a valid %', true); return; }
      catDefaults.set(type, { market_pct: v });
      applyPctToCategory(type, v, filtered);
      renderCatalog();
      updateStats();
    });

    // Expand if filter is active or if there are listed items
    if (q || listedCount > 0) sec.classList.add('open');

    // Wire up item rows
    wireItemRows(sec, filtered);

    body.appendChild(sec);
  }

  const total = document.querySelectorAll('.cat-section').length;
  document.getElementById('catalogSub').textContent =
    `${catalog.reduce((a,c) => a + c.items.length, 0)} items · ${catalog.length} categories`;
}

function renderItemRow(item) {
  const s   = selections.get(item.id);
  const checked = s?.checked ?? false;

  let priceHtml = '';
  if (s?.checked) {
    if (s.price_mode === 'market_pct' && s.market_pct) {
      const eff = item.market_price ? fmt(Math.round(item.market_price * s.market_pct)) : null;
      priceHtml = `
        <span class="price-tag">${eff || '—'}</span>
        <span class="pct-tag">${pctFmt(s.market_pct)}</span>`;
    } else if (s.price_mode === 'fixed' && s.fixed_price) {
      priceHtml = `<span class="price-tag">${fmt(s.fixed_price)}</span>`;
    } else {
      priceHtml = `<span class="price-tag none">no price</span>`;
    }
    if (s.notes) {
      priceHtml += `<span class="notes-tag" title="${esc(s.notes)}">${esc(s.notes)}</span>`;
    }
  } else {
    priceHtml = `<span class="price-tag none">not listed</span>`;
  }

  return `
    <div class="item-row ${checked ? '' : 'unchecked'}" data-id="${item.id}">
      <input type="checkbox" class="item-check" ${checked ? 'checked' : ''}>
      <img class="item-icon-xs" src="https://www.torn.com/images/items/${item.id}/large.png"
        alt="" onerror="this.style.display='none'">
      <span class="item-name-col" title="${esc(item.name)}">${esc(item.name)}</span>
      <div class="item-price-col">
        ${priceHtml}
        <button class="item-edit-btn ${s?.checked ? '' : 'hidden'}" title="Edit price">✏</button>
      </div>
    </div>
    <div class="item-editor" data-editor="${item.id}">
      <div class="mode-toggle-sm">
        <button class="mode-btn-sm ${!s || s.price_mode === 'market_pct' ? 'active' : ''}" data-emode="market_pct">% Market</button>
        <button class="mode-btn-sm ${s?.price_mode === 'fixed' ? 'active' : ''}" data-emode="fixed">Fixed $</button>
      </div>
      <div class="editor-mkt-wrap" style="display:${!s || s.price_mode !== 'fixed' ? 'flex' : 'none'};align-items:center;gap:.35rem">
        <span class="editor-label">%</span>
        <input type="number" class="editor-input editor-pct-val" min="1" max="300" step="0.5"
          placeholder="e.g. 85"
          value="${s?.market_pct ? (s.market_pct * 100).toFixed(1).replace(/\.0$/,'') : ''}">
      </div>
      <div class="editor-fixed-wrap" style="display:${s?.price_mode === 'fixed' ? 'flex' : 'none'};align-items:center;gap:.35rem">
        <span class="editor-label">$</span>
        <input type="number" class="editor-input editor-fixed-val" min="0"
          placeholder="e.g. 5000000"
          value="${s?.fixed_price || ''}">
      </div>
      <input type="text" class="editor-notes" placeholder="Notes (optional)"
        value="${esc(s?.notes || '')}">
      <button class="editor-apply">Apply</button>
      <button class="editor-clear">Clear price</button>
    </div>`;
}

function wireItemRows(sec, items) {
  for (const item of items) {
    const row    = sec.querySelector(`.item-row[data-id="${item.id}"]`);
    const editor = sec.querySelector(`.item-editor[data-editor="${item.id}"]`);
    if (!row || !editor) continue;

    // Checkbox
    const check = row.querySelector('.item-check');
    check.addEventListener('change', e => {
      e.stopPropagation();
      setItemChecked(item, check.checked);
      row.classList.toggle('unchecked', !check.checked);
      const editBtn = row.querySelector('.item-edit-btn');
      if (editBtn) editBtn.classList.toggle('hidden', !check.checked);
      updateCatCheckbox(sec, items);
      updateStats();
    });
    check.addEventListener('click', e => e.stopPropagation());

    // Edit button
    const editBtn = row.querySelector('.item-edit-btn');
    if (editBtn) {
      editBtn.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = editor.classList.contains('open');
        // Close any open editor
        document.querySelectorAll('.item-editor.open').forEach(el => {
          el.classList.remove('open');
          el.previousElementSibling?.classList.remove('editing');
          el.previousElementSibling?.querySelector('.item-edit-btn')?.classList.remove('active');
        });
        if (!isOpen) {
          editor.classList.add('open');
          row.classList.add('editing');
          editBtn.classList.add('active');
          openEditor = item.id;
        } else {
          openEditor = null;
        }
      });
    }

    // Mode toggle in editor
    editor.querySelectorAll('.mode-btn-sm').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.emode;
        editor.querySelectorAll('.mode-btn-sm').forEach(b => b.classList.toggle('active', b === btn));
        editor.querySelector('.editor-mkt-wrap').style.display   = mode === 'market_pct' ? 'flex' : 'none';
        editor.querySelector('.editor-fixed-wrap').style.display = mode === 'fixed'      ? 'flex' : 'none';
      });
    });

    // Apply button in editor
    editor.querySelector('.editor-apply').addEventListener('click', () => {
      const mode     = editor.querySelector('.mode-btn-sm.active').dataset.emode;
      const pctRaw   = parseFloat(editor.querySelector('.editor-pct-val').value);
      const fixedRaw = parseInt(editor.querySelector('.editor-fixed-val').value);
      const notes    = editor.querySelector('.editor-notes').value.trim();

      const mp = mode === 'market_pct' ? (pctRaw > 0 ? pctRaw / 100 : null) : null;
      const fp = mode === 'fixed'      ? (fixedRaw > 0 ? fixedRaw : null) : null;

      const sel = selections.get(item.id) || { checked: true };
      selections.set(item.id, { ...sel, checked: true, price_mode: mode, market_pct: mp, fixed_price: fp, notes });

      editor.classList.remove('open');
      row.classList.remove('editing');
      editor.previousElementSibling?.querySelector('.item-edit-btn')?.classList.remove('active');
      openEditor = null;
      renderCatalog();
      updateStats();
    });

    // Clear price
    editor.querySelector('.editor-clear').addEventListener('click', () => {
      const sel = selections.get(item.id) || { checked: true };
      selections.set(item.id, { ...sel, price_mode: 'market_pct', market_pct: null, fixed_price: null, notes: '' });
      editor.classList.remove('open');
      row.classList.remove('editing');
      openEditor = null;
      renderCatalog();
      updateStats();
    });
  }
}

/* ── Item / category helpers ──────────────────────────────────────────── */
function setItemChecked(item, checked) {
  const existing = selections.get(item.id) || {
    price_mode: 'market_pct',
    market_pct: catDefaults.get(item.type)?.market_pct
      ? catDefaults.get(item.type).market_pct / 100 : null,
    fixed_price: null, notes: '',
  };
  selections.set(item.id, { ...existing, checked });
}

function toggleCategory(type, checked, items) {
  const catDef = catDefaults.get(type) || {};
  for (const item of items) {
    if (checked) {
      const existing = selections.get(item.id);
      if (existing) {
        selections.set(item.id, { ...existing, checked: true });
      } else {
        // Apply category default
        selections.set(item.id, {
          checked:     true,
          price_mode:  catDef.market_pct ? 'market_pct' : 'market_pct',
          market_pct:  catDef.market_pct ? catDef.market_pct / 100 : null,
          fixed_price: null,
          notes:       '',
        });
      }
    } else {
      const s = selections.get(item.id);
      if (s) selections.set(item.id, { ...s, checked: false });
    }
  }
  renderCatalog();
  updateStats();
}

function applyPctToCategory(type, pct, items) {
  for (const item of items) {
    const existing = selections.get(item.id);
    if (existing?.checked) {
      selections.set(item.id, { ...existing, price_mode: 'market_pct', market_pct: pct / 100 });
    } else if (!existing) {
      // Don't auto-check items, just store for when they get checked
    }
    // If item is checked, apply. If not, don't force-check.
  }
}

function updateCatCheckbox(sec, items) {
  const check  = sec.querySelector('.cat-check');
  const count  = items.filter(i => selections.get(i.id)?.checked).length;
  const allOn  = count === items.length;
  const someOn = count > 0 && count < items.length;
  check.checked       = allOn;
  check.indeterminate = someOn;
}

/* ── Stats ────────────────────────────────────────────────────────────── */
function updateStats() {
  const checked  = [...selections.values()].filter(s => s.checked);
  const mktBased = checked.filter(s => s.price_mode === 'market_pct').length;
  const fixed    = checked.filter(s => s.price_mode === 'fixed').length;
  const cats     = new Set(
    catalog.flatMap(c => c.items.filter(i => selections.get(i.id)?.checked).map(() => c.type))
  ).size;

  document.getElementById('statTotal').textContent  = checked.length;
  document.getElementById('statCats').textContent   = cats;
  document.getElementById('statMktPct').textContent = mktBased;
  document.getElementById('statFixed').textContent  = fixed;

  const btn = document.getElementById('saveChangesBtn');
  btn.textContent = `Save (${checked.length})`;
}

/* ── Save ─────────────────────────────────────────────────────────────── */
document.getElementById('saveChangesBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveChangesBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;

  // Build the payload: all checked items
  const listings = [];
  for (const cat of catalog) {
    for (const item of cat.items) {
      const s = selections.get(item.id);
      if (s?.checked) {
        listings.push({
          torn_item_id: item.id,
          item_name:    item.name,
          item_type:    item.type,
          price_mode:   s.price_mode || 'market_pct',
          market_pct:   s.price_mode === 'market_pct' ? s.market_pct : null,
          fixed_price:  s.price_mode === 'fixed'      ? s.fixed_price : null,
          notes:        s.notes || null,
        });
      }
    }
  }

  try {
    const r = await api('/admin/api/trade/bulk-save', {
      method: 'POST',
      body: JSON.stringify({ listings }),
    });
    toast(`Saved — ${r.count} items listed`);
    updateStats();
  } catch (e) {
    toast('Save failed: ' + e.message, true);
  }

  btn.textContent = `Save (${[...selections.values()].filter(s=>s.checked).length})`;
  btn.disabled = false;
});

/* ── Expand / collapse all ────────────────────────────────────────────── */
document.getElementById('expandAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.cat-section').forEach(s => s.classList.add('open'));
});
document.getElementById('collapseAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('open'));
});

/* ── Category filter ──────────────────────────────────────────────────── */
document.getElementById('catSearch').addEventListener('input', e => {
  filterQ = e.target.value.trim();
  renderCatalog();
});

/* ── Logout ───────────────────────────────────────────────────────────── */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  location.href = '/admin';
});

/* ── Init ─────────────────────────────────────────────────────────────── */
loadProfile();
loadCatalog();
</script>
