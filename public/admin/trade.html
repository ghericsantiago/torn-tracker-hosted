<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Listings — Torn Tracker Admin</title>
  <link rel="stylesheet" href="/admin/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
  <style>
    /* ── Layout ─────────────────────────────────────────────────────────── */
    .dashboard { padding-top: 0.75rem; }

    /* Profile drawer */
    .profile-drawer {
      overflow: hidden; max-height: 0; transition: max-height 0.25s ease;
      margin-bottom: 0;
    }
    .profile-drawer.open { max-height: 400px; margin-bottom: 0.75rem; }
    .profile-inner { padding: 0.9rem 1.1rem; }
    .profile-inner h2 { font-size: 0.85rem; margin-bottom: 0.75rem; }
    .profile-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.75rem; }
    .profile-fields .field { margin: 0; }
    .profile-fields .field label { font-size: 0.68rem; }
    .profile-fields .field input { padding: 0.28rem 0.55rem; font-size: 0.8rem; }
    .profile-fields .field-wide { grid-column: 1/-1; }

    /* ── Catalog browser ────────────────────────────────────────────────── */
    .cat-browser { overflow: hidden; }

    /* Stats bar — inline pills inside header */
    .stat-pills { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .stat-pill {
      font-family: var(--mono); font-size: 0.65rem; padding: 0.18rem 0.5rem;
      border-radius: 99px; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03); white-space: nowrap;
    }
    .stat-pill span { font-weight: 700; }
    .stat-pill.sl { border-color: rgba(110,231,247,0.18); }
    .stat-pill.sl span { color: var(--accent); }
    .stat-pill.si span { color: var(--accent); }
    .stat-pill.so span { color: var(--success); }
    .stat-pill.sf span { color: var(--gold, #fbbf24); }

    /* Top bar */
    .browser-head {
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
      padding: 0.6rem 1rem; border-bottom: 1px solid var(--glass-border);
    }
    .browser-head h2 { font-size: 0.88rem; flex-shrink: 0; margin: 0; }

    /* Global default strip — single compact line */
    .global-strip {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.38rem 1rem; background: rgba(110,231,247,0.03);
      border-bottom: 1px solid rgba(110,231,247,0.08);
    }
    .global-strip-label {
      font-family: var(--mono); font-size: 0.6rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0;
    }
    .pct-input-sm {
      width: 56px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border); border-radius: 5px;
      padding: 0.2rem 0.4rem; color: var(--text);
      font-size: 0.78rem; font-family: var(--mono);
      text-align: right; outline: none;
    }
    .pct-input-sm:focus { border-color: rgba(110,231,247,0.4); }
    .pct-suffix { font-family: var(--mono); font-size: 0.72rem; color: var(--text-muted); }
    .cascade-hint { font-family: var(--mono); font-size: 0.6rem; color: rgba(255,255,255,0.2); margin-left: auto; }

    /* Toolbar */
    .browser-toolbar {
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
      padding: 0.4rem 1rem; border-bottom: 1px solid var(--glass-border);
    }
    .cat-search {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      border-radius: 6px; padding: 0.26rem 0.55rem; color: var(--text);
      font-size: 0.78rem; font-family: var(--sans); width: 150px; outline: none;
    }
    .cat-search:focus { border-color: rgba(110,231,247,0.3); }
    .toolbar-spacer { flex: 1; }
    .btn-save {
      background: var(--accent); color: #07080f;
      border: none; font-weight: 700; padding: 0.32rem 0.9rem;
      border-radius: 6px; font-size: 0.8rem; font-family: var(--sans);
      cursor: pointer; transition: all 0.16s;
    }
    .btn-save:hover { background: #93f0ff; }
    .btn-save:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Category sections ──────────────────────────────────────────────── */
    .cat-list { max-height: calc(100vh - 220px); overflow-y: auto; }

    .cat-section { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .cat-section:last-child { border-bottom: none; }

    .cat-row {
      display: flex; align-items: center; gap: 0.45rem;
      padding: 0.32rem 1rem;
      cursor: pointer; transition: background 0.14s; user-select: none;
    }
    .cat-row:hover { background: rgba(255,255,255,0.02); }

    .cat-check { width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); }
    .cat-label { font-weight: 600; font-size: 0.845rem; flex: 1; }
    .cat-tally { font-family: var(--mono); font-size: 0.65rem; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
    .cat-tally .n-listed { color: var(--accent); }

    /* Category % input with cascade indicator */
    .cat-pct-wrap {
      display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0;
      font-size: 0.75rem;
    }
    .cat-pct-label { color: var(--text-muted); font-family: var(--mono); font-size: 0.62rem; }
    .cat-pct-input {
      width: 52px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border); border-radius: 5px;
      padding: 0.2rem 0.4rem; color: var(--text);
      font-size: 0.78rem; font-family: var(--mono); text-align: right; outline: none;
    }
    .cat-pct-input:focus { border-color: rgba(129,140,248,0.5); }
    .cat-pct-input.has-value { border-color: rgba(129,140,248,0.3); color: #818cf8; }
    .cat-pct-inherit { font-family: var(--mono); font-size: 0.6rem; color: var(--text-muted); }

    .cat-chevron { font-size: 0.55rem; color: var(--text-muted); transition: transform 0.16s; flex-shrink: 0; pointer-events: none; }
    .cat-section.open .cat-chevron { transform: rotate(180deg); }

    .drag-handle { font-size: 1.1rem; color: var(--text-muted); cursor: grab; flex-shrink: 0; padding: 0 0.15rem; line-height: 1; user-select: none; touch-action: none; }
    .drag-handle:active { cursor: grabbing; }
    .sortable-ghost  { opacity: 0.35; background: rgba(110,231,247,0.04); }
    .sortable-chosen > .cat-row { background: rgba(110,231,247,0.04); }
    .sortable-drag   { opacity: 1; }

    .sort-btns { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
    .sort-btn {
      background: none; border: none; cursor: pointer; padding: 0 0.2rem;
      font-size: 0.5rem; line-height: 1.2; color: var(--text-muted);
      transition: color 0.12s; font-family: monospace;
    }
    .sort-btn:hover { color: var(--accent); }

    /* ── Item rows ──────────────────────────────────────────────────────── */
    .cat-items { display: none; }
    .cat-section.open .cat-items { display: block; }

    .item-row {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.22rem 1rem 0.22rem 2.4rem;
      border-top: 1px solid rgba(255,255,255,0.025);
      transition: background 0.12s; min-width: 0;
    }
    .item-row:hover { background: rgba(255,255,255,0.018); }
    .item-row.unchecked { opacity: 0.35; }
    .item-row.editing   { background: rgba(74,222,128,0.03); opacity: 1; }

    .item-check { width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); }
    .item-icon-xs {
      width: 22px; height: 22px; flex-shrink: 0;
      border-radius: 4px; object-fit: contain; padding: 1px;
      image-rendering: pixelated; border: 1px solid rgba(255,255,255,0.06);
    }
    .item-name-col { font-size: 0.81rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-price-col { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }

    /* Price tags */
    .ptag { font-family: var(--mono); font-size: 0.73rem; }
    .ptag.l1 { color: rgba(110,231,247,0.45); font-style: italic; }   /* global inherit */
    .ptag.l2 { color: rgba(129,140,248,0.6);  font-style: italic; }   /* cat inherit */
    .ptag.l3 { color: var(--success); }                                /* item override */
    .ptag.none { color: var(--text-muted); font-style: italic; }
    .ptag.fixed-tag { color: var(--gold); }
    .pbadge {
      font-family: var(--mono); font-size: 0.59rem; padding: 0.06rem 0.3rem;
      border-radius: 3px; font-weight: 600;
    }
    .pbadge.l1 { background: rgba(110,231,247,0.07); border: 1px solid rgba(110,231,247,0.12); color: rgba(110,231,247,0.5); }
    .pbadge.l2 { background: rgba(129,140,248,0.08); border: 1px solid rgba(129,140,248,0.18); color: rgba(129,140,248,0.7); }
    .pbadge.l3 { background: rgba(74,222,128,0.08);  border: 1px solid rgba(74,222,128,0.18); color: rgba(74,222,128,0.8); }
    .pbadge.fx { background: rgba(251,191,36,0.08);  border: 1px solid rgba(251,191,36,0.18); color: rgba(251,191,36,0.8); }

    .notes-tag { font-size: 0.66rem; color: var(--text-muted); max-width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .clear-ovr { background: none; border: none; font-size: 0.65rem; color: var(--text-muted); cursor: pointer; padding: 0.1rem 0.2rem; border-radius: 3px; transition: color 0.12s; }
    .clear-ovr:hover { color: var(--error); }

    .item-edit-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.7rem; padding: 0.18rem 0.3rem; border-radius: 4px;
      color: var(--text-muted); transition: all 0.12s; flex-shrink: 0;
    }
    .item-edit-btn:hover { background: var(--glass-hover); color: var(--text); }
    .item-edit-btn.active { background: rgba(74,222,128,0.1); color: var(--success); }

    /* ── Inline item editor ─────────────────────────────────────────────── */
    .item-editor {
      display: none; flex-wrap: wrap; gap: 0.4rem; align-items: center;
      padding: 0.4rem 1rem 0.45rem 2.4rem;
      border-top: 1px solid rgba(74,222,128,0.1);
      background: rgba(74,222,128,0.025);
    }
    .item-editor.open { display: flex; }

    .editor-label { font-size: 0.68rem; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; }

    /* Level selector — 3 pills */
    .level-sel { display: flex; gap: 0.25rem; }
    .lbtn {
      padding: 0.24rem 0.6rem; border-radius: 5px;
      font-size: 0.72rem; font-weight: 500; font-family: var(--sans);
      border: 1px solid var(--glass-border); background: transparent;
      color: var(--text-muted); cursor: pointer; transition: all 0.14s;
      white-space: nowrap;
    }
    .lbtn:hover { background: var(--glass-hover); }
    .lbtn.active-l1 { background: rgba(110,231,247,0.1); border-color: rgba(110,231,247,0.25); color: var(--accent); }
    .lbtn.active-l2 { background: rgba(129,140,248,0.1); border-color: rgba(129,140,248,0.3); color: #818cf8; }
    .lbtn.active-l3 { background: rgba(74,222,128,0.1);  border-color: rgba(74,222,128,0.25); color: var(--success); }

    .editor-val-wrap { display: flex; align-items: center; gap: 0.35rem; }
    .editor-input {
      width: 100px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border); border-radius: 6px;
      padding: 0.25rem 0.5rem; color: var(--text);
      font-size: 0.8rem; font-family: var(--mono); outline: none;
    }
    .editor-input:focus { border-color: rgba(74,222,128,0.4); }
    .editor-notes {
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 6px; padding: 0.25rem 0.5rem; color: var(--text);
      font-size: 0.78rem; font-family: var(--sans); outline: none; width: 150px;
    }
    .editor-notes:focus { border-color: rgba(74,222,128,0.4); }
    .editor-apply {
      background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25);
      border-radius: 6px; padding: 0.25rem 0.65rem;
      font-size: 0.75rem; color: var(--success); cursor: pointer;
      font-family: var(--sans); transition: all 0.14s;
    }
    .editor-apply:hover { background: rgba(74,222,128,0.2); }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: #1d2540; border: 1px solid var(--glass-border);
      border-radius: 10px; padding: 0.6rem 1.1rem;
      font-size: 0.825rem; color: var(--text); z-index: 1000;
      display: none; box-shadow: 0 4px 24px rgba(0,0,0,0.5); font-family: var(--mono);
    }
    #toast.show { display: block; animation: tIn 0.2s; }
    #toast.err  { border-color: rgba(248,113,113,0.3); color: var(--error); }
    @keyframes tIn { from { opacity:0; transform: translateX(-50%) translateY(8px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .cat-pct-input { width: 44px; font-size: .72rem; }
      .cat-pct-label { display: none; }
      .cat-list { max-height: calc(100vh - 200px); }
      .profile-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand"><span class="mono accent">&gt;_</span> Torn Tracker</span>
    <div class="nav-right">
      <a href="/admin/dashboard" class="btn btn-ghost btn-sm mobile-hide">← Dashboard</a>
      <a href="/admin/trade" class="btn btn-ghost btn-sm mobile-hide" style="color:var(--accent)">Trade Admin</a>
      <a href="/admin/receipts" class="btn btn-ghost btn-sm mobile-hide">Receipts</a>

    <a href="/admin/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
    <a href="/admin/trade" class="btn btn-ghost btn-sm">Trade Admin</a>
    <a href="/admin/receipts" class="btn btn-ghost btn-sm">Receipts</a>
    <a href="/trade" target="_blank" class="btn btn-ghost btn-sm">View Listing</a>
    <button id="logoutBtnMobile" class="btn btn-ghost btn-sm">Logout</button>
  </div>
</nav>

<main class="dashboard">

  <!-- Profile drawer (collapsed by default) -->
  <div class="glass-card profile-drawer" id="profileDrawer">
    <div class="profile-inner">
      <h2>Trader Profile</h2>
      <form id="profileForm">
        <div class="profile-fields">
          <div class="field">
            <label>Display Name</label>
            <input type="text" id="pDisplayName" placeholder="Your in-game name" required>
          </div>
          <div class="field">
            <label>Discord Handle</label>
            <input type="text" id="pDiscord" placeholder="@Name#1234">
          </div>
          <div class="field">
            <label>Torn Profile URL</label>
            <input type="url" id="pTornUrl" placeholder="torn.com/profiles.php?XID=...">
          </div>
          <div class="field">
            <label>Bio</label>
            <textarea id="pBio" rows="2" placeholder="What you're looking for…"
              style="background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:7px;padding:.35rem .6rem;color:var(--text);font-size:.8rem;font-family:var(--sans);resize:vertical;outline:none;width:100%"></textarea>
          </div>
          <div class="field-wide" style="display:flex;justify-content:flex-end;margin-top:.25rem">
            <button type="submit" class="btn btn-primary btn-sm" id="saveProfileBtn">Save Profile</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Catalog browser — full width -->
  <div class="glass-card cat-browser">

    <!-- Header: title + stats pills + profile toggle -->
    <div class="browser-head">
      <h2>Item Catalog</h2>
      <span style="font-family:var(--mono);font-size:.62rem;color:var(--text-muted)" id="catalogSub">Loading…</span>
      <div class="stat-pills" id="statPills">
        <span class="stat-pill sl"><span id="statTotal">—</span> listed</span>
        <span class="stat-pill si"><span id="statInherit">—</span> inherit</span>
        <span class="stat-pill so"><span id="statOverride">—</span> override</span>
        <span class="stat-pill sf"><span id="statFixed">—</span> fixed</span>
      </div>
      <div style="margin-left:auto;display:flex;gap:.4rem;align-items:center">
        <button class="btn btn-ghost btn-sm" id="profileToggleBtn">Profile ▾</button>
      </div>
    </div>

    <!-- Global default strip (Level 1) — compact -->
    <div class="global-strip">
      <span class="global-strip-label">L1 Global %</span>
      <input type="number" class="pct-input-sm" id="globalPctInput"
        placeholder="—" min="1" max="500" step="1" title="Global default margin %">
      <span class="pct-suffix">%</span>
      <span class="cascade-hint">→ L2 category % → L3 item override</span>
    </div>

    <!-- Toolbar -->
    <div class="browser-toolbar">
      <input class="cat-search" id="catSearch" placeholder="Filter items…" autocomplete="off">
      <button class="btn btn-ghost btn-sm" id="expandAllBtn">Expand All</button>
      <button class="btn btn-ghost btn-sm" id="collapseAllBtn">Collapse</button>
      <button class="btn btn-ghost btn-sm" id="resetOrderBtn">Reset Order</button>
      <div class="toolbar-spacer"></div>
      <button class="btn-save" id="saveChangesBtn" disabled>Save</button>
    </div>

    <!-- Category list -->
    <div class="cat-list" id="catalogBody">
      <div style="padding:2rem;text-align:center;color:var(--text-muted);font-family:var(--mono);font-size:.8rem">
        Loading item catalog…
      </div>
    </div>

  </div>

</main>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   State
   ─────────────────────────────────────────────────────────────
   globalPct  : number|null  — L1 global default (stored as %, e.g. 80)
   catPcts    : { type → number }  — L2 category overrides (as %)
   selections : Map<itemId, { checked, override: null | { price_mode, market_pct, fixed_price, notes } }>
     override = null  → item inherits from category or global cascade
     override = obj   → explicit item-level price (L3)
   catalog    : [{ type, items }]
═══════════════════════════════════════════════════════════════ */
let globalPct  = null;
let catPcts    = {};
let catalog    = [];
let catOrder   = [];   // display order — array of type strings
let selections = new Map();
let filterQ    = '';
let sortableInst = null;

const fmt    = n => n == null ? '—' : '$' + Number(n).toLocaleString();
const pctFmt = v => v == null ? '' : Number(v).toFixed(1).replace(/\.0$/, '') + '%';

/* ── Utils ────────────────────────────────────────────────────────────── */
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show' + (err ? ' err' : '');
  clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 2800);
}
async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) { const j = await r.json().catch(() => ({ error: r.statusText })); throw new Error(j.error || r.statusText); }
  return r.json();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Resolve effective price for display ──────────────────────────────── */
function resolvePrice(item) {
  const s = selections.get(item.id);
  if (!s?.checked) return { level: 'none' };

  // L3 explicit item override
  if (s.override) {
    const o = s.override;
    if (o.price_mode === 'fixed') {
      const eff = o.fixed_price;
      return { level: 'l3', price_mode: 'fixed', eff, label: fmt(eff), badge: 'Fixed', notes: o.notes };
    }
    if (o.price_mode === 'market_pct' && o.market_pct != null) {
      const eff = item.market_price ? Math.round(item.market_price * o.market_pct / 100) : null;
      return { level: 'l3', price_mode: 'market_pct', eff, label: fmt(eff), badge: pctFmt(o.market_pct), notes: o.notes };
    }
  }

  // L2 category default
  const cp = catPcts[item.type];
  if (cp != null) {
    const eff = item.market_price ? Math.round(item.market_price * cp / 100) : null;
    return { level: 'l2', price_mode: 'market_pct', eff, label: fmt(eff), badge: pctFmt(cp) + ' cat' };
  }

  // L1 global default
  if (globalPct != null) {
    const eff = item.market_price ? Math.round(item.market_price * globalPct / 100) : null;
    return { level: 'l1', price_mode: 'market_pct', eff, label: fmt(eff), badge: pctFmt(globalPct) + ' global' };
  }

  return { level: 'noPrice' };
}

/* ── Profile ──────────────────────────────────────────────────────────── */
async function loadProfile() {
  try {
    const p = await api('/admin/api/trade/profile');
    document.getElementById('pDisplayName').value = p.display_name || '';
    document.getElementById('pDiscord').value     = p.discord_handle || '';
    document.getElementById('pTornUrl').value     = p.torn_profile_url || '';
    document.getElementById('pBio').value         = p.bio || '';
  } catch (e) { toast('Failed to load profile: ' + e.message, true); }
}
document.getElementById('profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('saveProfileBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    await api('/admin/api/trade/profile', { method: 'PUT', body: JSON.stringify({
      display_name: document.getElementById('pDisplayName').value,
      discord_handle: document.getElementById('pDiscord').value,
      bio: document.getElementById('pBio').value,
      torn_profile_url: document.getElementById('pTornUrl').value,
    })});
    toast('Profile saved');
  } catch (e) { toast('Save failed: ' + e.message, true); }
  btn.textContent = 'Save Profile'; btn.disabled = false;
});

/* ── Load catalog ─────────────────────────────────────────────────────── */
async function loadCatalog() {
  try {
    const data = await api('/admin/api/trade/all-items');
    catalog  = data.categories;
    catPcts  = {};
    for (const [t, v] of Object.entries(data.cat_pcts || {})) {
      catPcts[t] = v != null ? parseFloat(v) * 100 : null;
    }
    globalPct = data.global_pct != null ? parseFloat(data.global_pct) * 100 : null;

    // Set global input
    document.getElementById('globalPctInput').value = globalPct != null ? globalPct : '';

    // Init selections from existing listings
    selections.clear();
    for (const { items } of catalog) {
      for (const item of items) {
        if (!item.listing_id) continue;
        const checked = item.is_active !== false;
        let override = null;
        if (item.price_mode === 'fixed' && item.fixed_price != null) {
          override = { price_mode: 'fixed', fixed_price: item.fixed_price, market_pct: null, notes: item.notes || '' };
        } else if (item.price_mode === 'market_pct' && item.market_pct != null) {
          // explicit item-level override (not null = override)
          override = { price_mode: 'market_pct', market_pct: parseFloat(item.market_pct) * 100, fixed_price: null, notes: item.notes || '' };
        }
        // market_pct=null means inherit → no override
        selections.set(item.id, { checked, override });
      }
    }

    // Load / initialise category order — server wins over localStorage
    const defaultOrder = data.categories.map(c => c.type);
    const serverOrder  = Array.isArray(data.category_order) ? data.category_order : [];
    const baseOrder    = serverOrder.length > 0 ? serverOrder : (() => {
      try { return JSON.parse(localStorage.getItem('trade-cat-order') || '[]'); } catch { return []; }
    })();
    const validBase = baseOrder.filter(t => defaultOrder.includes(t));
    catOrder = [...validBase, ...defaultOrder.filter(t => !validBase.includes(t))];

    renderCatalog();
    updateStats();
    document.getElementById('saveChangesBtn').disabled = false;
  } catch (e) {
    document.getElementById('catalogBody').innerHTML =
      `<div style="padding:2rem;text-align:center;color:var(--error);font-family:var(--mono);font-size:.8rem">Error: ${e.message}</div>`;
  }
}

/* ── Global default: update on input change ──────────────────────────── */
document.getElementById('globalPctInput').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  globalPct = (!isNaN(v) && v > 0) ? v : null;
  updateStats();
});
document.getElementById('globalPctInput').addEventListener('change', () => { renderCatalog(); });

/* ── Render catalog ───────────────────────────────────────────────────── */
function renderCatalog() {
  const body = document.getElementById('catalogBody');
  const prevOpen = new Set([...body.querySelectorAll('.cat-section.open')].map(s => s.dataset.type));
  body.innerHTML = '';
  const q = filterQ.toLowerCase();

  const orderedCatalog = [...catOrder]
    .map(t => catalog.find(c => c.type === t))
    .filter(Boolean);

  for (const { type, items } of orderedCatalog) {
    const filtered = q
      ? items.filter(i => i.name.toLowerCase().includes(q) || type.toLowerCase().includes(q))
      : items;
    if (!filtered.length) continue;

    const listedCount   = filtered.filter(i => selections.get(i.id)?.checked).length;
    const checkedCount  = listedCount;
    const catChecked    = checkedCount === filtered.length && filtered.length > 0;
    const catIndet      = checkedCount > 0 && checkedCount < filtered.length;
    const catPct        = catPcts[type] ?? null;
    const resolvedLabel = catPct != null ? `${pctFmt(catPct)}` : (globalPct != null ? `↑ ${pctFmt(globalPct)} global` : '—');
    const isOpen        = prevOpen.has(type) || (q && filtered.some(i => i.name.toLowerCase().includes(q)));

    const sec = document.createElement('div');
    sec.className = 'cat-section' + (isOpen ? ' open' : '');
    sec.dataset.type = type;

    sec.innerHTML = `
      <div class="cat-row">
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <input type="checkbox" class="cat-check" ${catChecked ? 'checked' : ''}>
        <span class="cat-label">${esc(type)}</span>
        <span class="cat-tally"><span class="n-listed">${listedCount}</span>/${filtered.length}</span>
        <div class="cat-pct-wrap" onclick="event.stopPropagation()">
          <span class="cat-pct-label">L2 %</span>
          <input type="number" class="cat-pct-input ${catPct != null ? 'has-value' : ''}"
            value="${catPct != null ? catPct : ''}" placeholder="${globalPct != null ? pctFmt(globalPct) : '—'}"
            min="1" max="500" step="1" title="Category default margin (overrides global)">
          <span class="cat-pct-inherit">${catPct != null ? '' : '(global)'}</span>
        </div>
        <div class="sort-btns" onclick="event.stopPropagation()">
          <button class="sort-btn" data-dir="-1" title="Move up">▲</button>
          <button class="sort-btn" data-dir="1"  title="Move down">▼</button>
        </div>
        <span class="cat-chevron">▼</span>
      </div>
      <div class="cat-items">
        ${filtered.map(item => renderItemRow(item, type)).join('')}
      </div>`;

    // Tri-state
    const catCheck = sec.querySelector('.cat-check');
    if (catIndet) catCheck.indeterminate = true;
    catCheck.addEventListener('change', e => { e.stopPropagation(); toggleCategory(type, catCheck.checked, filtered); });
    catCheck.addEventListener('click', e => e.stopPropagation());

    // Expand/collapse
    sec.querySelector('.cat-row').addEventListener('click', e => {
      if (e.target.closest('.cat-pct-wrap') || e.target.closest('.cat-check') ||
          e.target.closest('.sort-btns') || e.target.closest('.drag-handle')) return;
      sec.classList.toggle('open');
    });

    // ▲▼ sort buttons
    sec.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); moveCategory(type, parseInt(btn.dataset.dir)); });
    });


    // Category % input — update state while typing, re-render only on blur
    const pctInput = sec.querySelector('.cat-pct-input');
    pctInput.addEventListener('input', () => {
      const v = parseFloat(pctInput.value);
      catPcts[type] = (!isNaN(v) && v > 0) ? v : null;
      pctInput.classList.toggle('has-value', catPcts[type] != null);
      updateStats();
    });
    pctInput.addEventListener('change', () => { renderCatalog(); });

    // Wire item rows
    wireItemRows(sec, filtered, type);
    body.appendChild(sec);
  }

  const total = catalog.reduce((a, c) => a + c.items.length, 0);
  document.getElementById('catalogSub').textContent =
    `${total} items · ${catalog.length} categories`;

  initSortable();
}

function renderItemRow(item, type) {
  const s   = selections.get(item.id);
  const chk = s?.checked ?? false;
  const res = resolvePrice(item);

  let priceHtml = '';
  if (!chk) {
    priceHtml = `<span class="ptag none">not listed</span>`;
  } else if (res.level === 'noPrice') {
    priceHtml = `<span class="ptag none">no price set</span>`;
  } else {
    priceHtml = `<span class="ptag ${res.level}">${res.label}</span>
                 <span class="pbadge ${res.level === 'fixed' ? 'fx' : res.level}">${esc(res.badge)}</span>`;
    if (res.notes) priceHtml += `<span class="notes-tag" title="${esc(res.notes)}">${esc(res.notes)}</span>`;
    if (s?.override) priceHtml += `<button class="clear-ovr" title="Clear item override" onclick="clearOverride(${item.id},event)">×</button>`;
  }

  const editMode = s?.override?.price_mode || 'inherit';
  const pctVal   = s?.override?.market_pct != null ? s.override.market_pct : '';
  const fixedVal = s?.override?.fixed_price || '';
  const noteVal  = esc(s?.override?.notes || (s?.checked && !s?.override ? (item.notes || '') : ''));

  return `
    <div class="item-row ${chk ? '' : 'unchecked'}" data-id="${item.id}">
      <input type="checkbox" class="item-check" ${chk ? 'checked' : ''}>
      <img class="item-icon-xs" src="https://www.torn.com/images/items/${item.id}/large.png" alt="" onerror="this.style.display='none'">
      <span class="item-name-col" title="${esc(item.name)}">${esc(item.name)}</span>
      <div class="item-price-col">
        ${priceHtml}
        <button class="item-edit-btn ${s?.override ? 'active' : ''}" title="Set item override">✏</button>
      </div>
    </div>
    <div class="item-editor" data-editor="${item.id}">
      <span class="editor-label">L3 Override</span>
      <div class="level-sel">
        <button class="lbtn ${!s?.override ? 'active-l1' : ''}" data-lv="inherit">
          ${catPcts[type] != null ? `Cat (${pctFmt(catPcts[type])})` : globalPct != null ? `Global (${pctFmt(globalPct)})` : 'Inherit'}
        </button>
        <button class="lbtn ${s?.override?.price_mode === 'market_pct' ? 'active-l3' : ''}" data-lv="market_pct">Custom %</button>
        <button class="lbtn ${s?.override?.price_mode === 'fixed' ? 'active-l3' : ''}" data-lv="fixed">Fixed $</button>
      </div>
      <div class="editor-val-wrap editor-pct-wrap" style="display:${editMode === 'market_pct' ? 'flex' : 'none'}">
        <input type="number" class="editor-input epct" min="1" max="500" step="0.5" placeholder="e.g. 100" value="${pctVal}">
        <span class="editor-label">%</span>
      </div>
      <div class="editor-val-wrap editor-fixed-wrap" style="display:${editMode === 'fixed' ? 'flex' : 'none'}">
        <input type="number" class="editor-input efixed" min="0" placeholder="e.g. 5000000" value="${fixedVal}">
        <span class="editor-label">$</span>
      </div>
      <input type="text" class="editor-notes" placeholder="Notes (optional)" value="${noteVal}">
      <button class="editor-apply">Apply</button>
    </div>`;
}

function wireItemRows(sec, items, type) {
  for (const item of items) {
    const row    = sec.querySelector(`.item-row[data-id="${item.id}"]`);
    const editor = sec.querySelector(`.item-editor[data-editor="${item.id}"]`);
    if (!row || !editor) continue;

    row.querySelector('.item-check').addEventListener('change', e => {
      e.stopPropagation();
      const chk = e.target.checked;
      const s   = selections.get(item.id) || { override: null };
      if (chk && !s.checked) {
        // Auto-assign if no override and no inherited price: use category or global
        selections.set(item.id, { ...s, checked: true });
      } else {
        selections.set(item.id, { ...s, checked: chk });
      }
      row.classList.toggle('unchecked', !chk);
      updateCatCheckbox(sec, items);
      updateStats();
      renderCatalog();
    });
    row.querySelector('.item-check').addEventListener('click', e => e.stopPropagation());

    row.querySelector('.item-edit-btn').addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = editor.classList.contains('open');
      document.querySelectorAll('.item-editor.open').forEach(el => {
        el.classList.remove('open');
        el.previousElementSibling?.classList.remove('editing');
        el.previousElementSibling?.querySelector('.item-edit-btn')?.classList.remove('active');
      });
      if (!isOpen) { editor.classList.add('open'); row.classList.add('editing'); }
    });

    // Level selector
    editor.querySelectorAll('.lbtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lv = btn.dataset.lv;
        editor.querySelectorAll('.lbtn').forEach(b => b.className = b.className.replace(/ active-l\d/g, ''));
        btn.classList.add(lv === 'inherit' ? 'active-l1' : 'active-l3');
        editor.querySelector('.editor-pct-wrap').style.display   = lv === 'market_pct' ? 'flex' : 'none';
        editor.querySelector('.editor-fixed-wrap').style.display = lv === 'fixed'      ? 'flex' : 'none';
      });
    });

    // Apply
    editor.querySelector('.editor-apply').addEventListener('click', () => {
      const lv   = editor.querySelector('.lbtn.active-l3, .lbtn.active-l1').dataset.lv;
      const pctR = parseFloat(editor.querySelector('.epct').value);
      const fixR = parseInt(editor.querySelector('.efixed').value);
      const note = editor.querySelector('.editor-notes').value.trim();

      if (lv === 'inherit') {
        // Remove override — item falls back to cascade
        const s = selections.get(item.id) || { checked: true };
        selections.set(item.id, { ...s, override: note ? { ...s.override, notes: note } : null });
      } else if (lv === 'market_pct') {
        if (!pctR || pctR <= 0) { toast('Enter a valid %', true); return; }
        const s = selections.get(item.id) || { checked: true };
        selections.set(item.id, { ...s, checked: true, override: { price_mode: 'market_pct', market_pct: pctR, fixed_price: null, notes: note } });
      } else {
        if (!fixR || fixR <= 0) { toast('Enter a valid price', true); return; }
        const s = selections.get(item.id) || { checked: true };
        selections.set(item.id, { ...s, checked: true, override: { price_mode: 'fixed', fixed_price: fixR, market_pct: null, notes: note } });
      }

      editor.classList.remove('open');
      row.classList.remove('editing');
      renderCatalog();
      updateStats();
    });
  }
}

/* ── Category sort ────────────────────────────────────────────────────── */
function initSortable() {
  if (sortableInst) sortableInst.destroy();
  sortableInst = Sortable.create(document.getElementById('catalogBody'), {
    handle:      '.drag-handle',
    animation:   180,
    ghostClass:  'sortable-ghost',
    chosenClass: 'sortable-chosen',
    dragClass:   'sortable-drag',
    onEnd() {
      catOrder = [...document.querySelectorAll('.cat-section')].map(s => s.dataset.type);
      saveCatOrder();
      // no renderCatalog — DOM is already in the right order
    },
  });
}

function moveCategory(type, dir) {
  const i = catOrder.indexOf(type);
  const j = i + dir;
  if (j < 0 || j >= catOrder.length) return;
  [catOrder[i], catOrder[j]] = [catOrder[j], catOrder[i]];
  saveCatOrder(); renderCatalog();
}
function saveCatOrder() {
  localStorage.setItem('trade-cat-order', JSON.stringify(catOrder));
}

/* ── External functions (called from inline HTML) ─────────────────────── */
window.clearOverride = function(itemId, e) {
  e.stopPropagation();
  const s = selections.get(itemId);
  if (s) selections.set(itemId, { ...s, override: null });
  renderCatalog(); updateStats();
};

/* ── Category helpers ─────────────────────────────────────────────────── */
function toggleCategory(type, checked, items) {
  for (const item of items) {
    // skip items with no market price when bulk-checking — must be set individually with a fixed price
    if (checked && !item.market_price) continue;
    const s = selections.get(item.id) || { override: null };
    selections.set(item.id, { ...s, checked });
  }
  renderCatalog(); updateStats();
}

function updateCatCheckbox(sec, items) {
  const check = sec.querySelector('.cat-check');
  const n = items.filter(i => selections.get(i.id)?.checked).length;
  check.checked = n === items.length;
  check.indeterminate = n > 0 && n < items.length;
}

/* ── Stats ────────────────────────────────────────────────────────────── */
function updateStats() {
  const checked = [...selections.values()].filter(s => s.checked);
  const overrides = checked.filter(s => s.override && s.override.price_mode !== 'fixed').length;
  const fixed     = checked.filter(s => s.override?.price_mode === 'fixed').length;
  const inherit   = checked.length - overrides - fixed;

  document.getElementById('statTotal').textContent    = checked.length;
  document.getElementById('statInherit').textContent  = inherit;
  document.getElementById('statOverride').textContent = overrides;
  document.getElementById('statFixed').textContent    = fixed;

  const btn = document.getElementById('saveChangesBtn');
  btn.textContent = `Save (${checked.length})`;
}

/* ── Save ─────────────────────────────────────────────────────────────── */
document.getElementById('saveChangesBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveChangesBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;

  const listings = [];
  for (const { type, items } of catalog) {
    for (const item of items) {
      const s = selections.get(item.id);
      if (!s?.checked) continue;
      const o = s.override;
      listings.push({
        torn_item_id: item.id,
        item_name:    item.name,
        item_type:    item.type,
        price_mode:   o?.price_mode || 'market_pct',
        // null market_pct → stored as NULL in DB → inherits from cascade
        market_pct:   o?.price_mode === 'market_pct' && o.market_pct != null
                        ? o.market_pct / 100 : null,
        fixed_price:  o?.price_mode === 'fixed' ? o.fixed_price : null,
        notes:        o?.notes || null,
      });
    }
  }

  const configCats = {};
  for (const [type, pct] of Object.entries(catPcts)) {
    if (pct != null) configCats[type] = pct;
  }

  try {
    const r = await api('/admin/api/trade/bulk-save', {
      method: 'POST',
      body: JSON.stringify({
        listings,
        config: { global_pct: globalPct, categories: configCats, category_order: catOrder },
      }),
    });
    toast(`Saved — ${r.count} items listed`);
  } catch (e) { toast('Save failed: ' + e.message, true); }

  const n = [...selections.values()].filter(s => s.checked).length;
  btn.textContent = `Save (${n})`; btn.disabled = false;
});

/* ── Toolbar ──────────────────────────────────────────────────────────── */
document.getElementById('expandAllBtn').addEventListener('click', () =>
  document.querySelectorAll('.cat-section').forEach(s => s.classList.add('open')));
document.getElementById('collapseAllBtn').addEventListener('click', () =>
  document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('open')));
document.getElementById('resetOrderBtn').addEventListener('click', () => {
  catOrder = catalog.map(c => c.type).sort((a, b) => a.localeCompare(b));
  saveCatOrder(); renderCatalog();
});
document.getElementById('catSearch').addEventListener('input', e => {
  filterQ = e.target.value.trim(); renderCatalog();
});

/* ── Burger menu ──────────────────────────────────────────────────────── */
document.getElementById('navBurger').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.addEventListener('click', e => { if (!e.target.closest('.nav')) document.body.classList.remove('nav-open'); });
document.getElementById('logoutBtnMobile').addEventListener('click', () => { document.body.classList.remove('nav-open'); document.getElementById('logoutBtn').click(); });

/* ── Profile drawer toggle ────────────────────────────────────────────── */
document.getElementById('profileToggleBtn').addEventListener('click', () => {
  const drawer = document.getElementById('profileDrawer');
  const btn    = document.getElementById('profileToggleBtn');
  const open   = drawer.classList.toggle('open');
  btn.textContent = open ? 'Profile ▴' : 'Profile ▾';
});

/* ── Logout ───────────────────────────────────────────────────────────── */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' }); location.href = '/admin';
});

/* ── Init ─────────────────────────────────────────────────────────────── */
loadProfile();
loadCatalog();
</script>
