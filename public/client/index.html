<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torn Item Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.0.1/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="https://www.amcharts.com/lib/3/amcharts.js"></script>
  <script src="https://www.amcharts.com/lib/3/serial.js"></script>
  <script src="https://www.amcharts.com/lib/3/themes/dark.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <span class="nav-brand"><span class="mono accent">&gt;_</span> Torn Item Tracker</span>
      <div class="nav-right">
        <button id="tzToggle" class="btn btn-ghost btn-sm">TCT</button>
        <button id="autoRefreshToggle" class="btn btn-ghost btn-sm">Auto-Refresh: Off</button>
      </div>
    </div>
  </nav>

  <div class="layout">

    <!-- LEFT SIDEBAR: Filters -->
    <aside class="sidebar-left">

      <!-- Item search: always visible -->
      <div class="glass-card sidebar-section item-search-card">
        <div class="section-title">Item</div>
        <div class="search-wrap">
          <input id="itemSearch" type="text" placeholder="Search item name…" autocomplete="off" />
          <div id="autocomplete" class="autocomplete hidden"></div>
        </div>
        <input id="itemIdInput" type="hidden" />
      </div>

      <!-- Quick nav: always visible (prev/apply/next) -->
      <div class="filter-quick-nav">
        <button id="prevDay" class="btn btn-ghost btn-sm">← Prev</button>
        <button id="applyFilters" class="btn btn-primary btn-sm" style="flex:1;justify-content:center">Apply</button>
        <button id="nextDay" class="btn btn-ghost btn-sm">Next →</button>
      </div>

      <!-- Mobile-only collapse toggle -->
      <button class="filter-toggle-row" id="filterToggle">
        <span class="filter-toggle-label">⚙ Date / Time</span>
        <span class="filter-toggle-icon" id="filterToggleIcon">▾</span>
      </button>

      <!-- Collapsible body: date/time details -->
      <div class="filter-collapse-body" id="filterCollapseBody">

        <div class="glass-card sidebar-section">
          <div class="section-title">Date Range</div>
          <div class="field-row">
            <label>From</label>
            <input id="startDate" type="date" />
          </div>
          <div class="field-row">
            <label>To</label>
            <input id="endDate" type="date" />
          </div>
          <div class="field-row">
            <label>Start Time</label>
            <input id="startTime" type="time" value="00:00" />
          </div>
          <div class="field-row">
            <label>End Time</label>
            <input id="endTime" type="time" value="23:59" />
          </div>
          <div class="btn-row">
            <button id="resetFilters" class="btn btn-ghost btn-sm btn-full">Reset</button>
          </div>
        </div>

      </div><!-- /filter-collapse-body -->
    </aside>

    <!-- MAIN: Chart -->
    <main class="main-area">

      <div class="glass-card chart-card">
        <div class="chart-top">
          <div class="item-info" id="itemInfo">
            <span class="item-name" id="displayName">Select an item</span>
            <span class="item-price" id="displayPrice"></span>
          </div>
          <div class="timeframe-btns">
            <button class="tf-btn" data-tf="1m">1m</button>
            <button class="tf-btn active" data-tf="5m">5m</button>
            <button class="tf-btn" data-tf="15m">15m</button>
            <button class="tf-btn" data-tf="30m">30m</button>
            <button class="tf-btn" data-tf="1h">1h</button>
            <button class="tf-btn" data-tf="day">1D</button>
          </div>
        </div>

        <div class="chart-type-tabs">
          <button class="ct-btn active" data-ct="line">Line</button>
          <button class="ct-btn" data-ct="bar">Bar</button>
          <button class="ct-btn" data-ct="scatter">Scatter</button>
          <button class="ct-btn" data-ct="candlestick">Candlestick</button>
        </div>

        <div class="chart-area">
          <canvas id="priceChart"></canvas>
          <div id="candlestickChart" style="display:none;width:100%;height:360px;"></div>
          <div id="chartStatus" class="chart-status">Select an item to view market data</div>
        </div>

        <div class="chart-footer">
          <button id="toggleTable" class="btn btn-ghost btn-sm">Show Data Table</button>
        </div>

        <div id="dataTable" class="data-table hidden">
          <table>
            <thead>
              <tr><th>Date</th><th>Item ID</th><th>Name</th><th>Avg Price</th><th>Price</th><th>Qty</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

    </main>

    <!-- RIGHT SIDEBAR: Calculator + Best Items (desktop) / Drawer (mobile) -->
    <aside class="sidebar-right" id="toolsDrawer">

      <!-- Mobile drawer close button (hidden on desktop) -->
      <div class="drawer-header">
        <span class="section-title" style="margin:0">Tools</span>
        <button class="drawer-close-btn" id="closeDrawer">✕</button>
      </div>

      <div class="glass-card sidebar-section">
        <div class="section-title">Profit Calculator</div>
        <div class="field-row">
          <label>Buy Price ($)</label>
          <input id="buyPrice" type="number" step="0.01" min="0" placeholder="0.00" />
        </div>
        <div class="field-row">
          <label>Transaction Fee (%)</label>
          <input id="txFee" type="number" step="0.01" min="0" max="100" value="5" />
        </div>
        <div class="field-row">
          <label>Target Sell Price ($)</label>
          <input id="targetPrice" type="number" step="0.01" min="0" placeholder="Auto break-even" />
        </div>
        <div class="calc-results">
          <div class="calc-row"><span>Fee Amount</span><span id="feeAmount">$0.00</span></div>
          <div class="calc-row"><span>Total Cost</span><span id="totalCost">$0.00</span></div>
          <div class="calc-row profit-row">
            <span>Profit</span>
            <span id="profitAmount" class="neutral">$0.00</span>
          </div>
          <div class="calc-row profit-row">
            <span>Margin</span>
            <span id="profitPct" class="neutral">0%</span>
          </div>
        </div>
        <button id="resetCalc" class="btn btn-ghost btn-sm btn-full">Reset</button>
      </div>

      <div class="glass-card sidebar-section">
        <div class="best-items-title">
          <div class="section-title">Best Items to Buy</div>
          <button id="refreshBestBtn" class="btn-refresh" title="Refresh">↻</button>
        </div>
        <div class="best-items-header">
          <span class="bi-sort" data-col="name">Item <span class="bi-sort-icon">↕</span></span>
          <span class="bi-sort" data-col="net_profit">Profit <span class="bi-sort-icon">↕</span></span>
          <span class="bi-sort" data-col="margin_pct">Margin <span class="bi-sort-icon">↕</span></span>
          <span class="bi-sort" data-col="confidence_pct">Conf <span class="bi-sort-icon">↕</span></span>
        </div>
        <div id="bestItemsList"><div class="loading-msg">Loading…</div></div>
      </div>

    </aside>
  </div>

  <!-- Mobile: overlay backdrop + floating action button -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <button class="tools-fab" id="toolsFab" aria-label="Open tools">
    <span class="fab-icon">$</span>
  </button>

  <script src="app.js"></script>
  <script>
    (function () {
      /* ── Filter collapse (mobile only) ── */
      var filterToggle = document.getElementById('filterToggle');
      var filterBody   = document.getElementById('filterCollapseBody');
      var filterIcon   = document.getElementById('filterToggleIcon');

      filterToggle.addEventListener('click', function () {
        var open = filterBody.classList.toggle('open');
        filterIcon.textContent = open ? '▴' : '▾';
      });

      /* ── Tools drawer (mobile only) ── */
      var toolsFab    = document.getElementById('toolsFab');
      var toolsDrawer = document.getElementById('toolsDrawer');
      var overlay     = document.getElementById('drawerOverlay');
      var closBtn     = document.getElementById('closeDrawer');

      function openTools() {
        toolsDrawer.classList.add('drawer-open');
        overlay.classList.add('visible');
        toolsFab.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeTools() {
        toolsDrawer.classList.remove('drawer-open');
        overlay.classList.remove('visible');
        toolsFab.classList.remove('active');
        document.body.style.overflow = '';
      }

      toolsFab.addEventListener('click', function () {
        toolsDrawer.classList.contains('drawer-open') ? closeTools() : openTools();
      });
      overlay.addEventListener('click', closeTools);
      closBtn.addEventListener('click', closeTools);
    })();
  </script>
</body>
</html>
