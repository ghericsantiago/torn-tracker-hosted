<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanted to Buy — Torn Tracker</title>
  <link rel="stylesheet" href="/trade/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand"><span class="mono accent">&gt;_</span> Torn Tracker</span>
    <div class="nav-search">
      <span class="search-icon">⌕</span>
      <input type="text" id="globalSearch" placeholder="Search items…" autocomplete="off">
    </div>
    <div class="nav-right">
      <a href="/admin/trade" class="btn">⚙ Manage</a>
    </div>
  </div>
</nav>

<div class="page">

  <!-- Hero -->
  <div class="hero">
    <!-- Top: label -->
    <div class="hero-label">Wanted to Buy</div>

    <!-- Name row: name left, contact right — always one row -->
    <div class="hero-name-row">
      <div class="hero-name" id="heroName">Loading…</div>
      <div class="hero-right" id="heroContact"></div>
    </div>

    <!-- Welcome message -->
    <div class="hero-welcome" id="welcomeCard" style="display:none">
      <div class="welcome-body" id="welcomeBody"></div>
    </div>

    <!-- Meta pills — always at the bottom -->
    <div class="hero-meta">
      <span class="meta-pill"><strong id="metaCount">—</strong> listings</span>
      <span class="meta-pill"><strong id="metaCats">—</strong> categories</span>
    </div>
  </div>

  <!-- Category filter bar -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- Loading skeleton -->
  <div class="skeleton" id="skeleton">
    <div class="skel-block" style="height:60px"></div>
    <div class="skel-block" style="height:180px"></div>
    <div class="skel-block" style="height:140px"></div>
  </div>

  <!-- No results -->
  <div class="no-results" id="noResults">🔍 No items match your search.</div>

  <!-- Category sections -->
  <div class="categories" id="categories"></div>

</div>

<footer class="footer" id="footer"></footer>
<script src="/trade/app.js"></script>
</body>
</html>
