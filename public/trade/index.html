<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanted to Buy — Torn Tracker</title>
  <link rel="stylesheet" href="/trade/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand"><span class="mono accent">&gt;_</span> Torn Tracker</span>
    <div class="nav-search">
      <span class="search-icon">⌕</span>
      <input type="text" id="globalSearch" placeholder="Search items..." autocomplete="off">
    </div>
    <div class="nav-right">
      <a href="/admin/trade" class="btn btn-sm">⚙ Manage</a>
    </div>
  </div>
</nav>

<div class="page">

  <!-- Hero -->
  <div class="hero" id="hero">
    <div class="hero-label">Wanted to Buy</div>
    <div class="hero-name" id="heroName">Loading…</div>
    <div class="hero-bio" id="heroBio"></div>
    <div class="hero-contact" id="heroContact"></div>
    <div class="hero-meta" id="heroMeta">
      <span class="meta-pill"><strong id="metaCount">—</strong> listings</span>
      <span class="meta-pill"><strong id="metaCats">—</strong> categories</span>
    </div>
  </div>

  <!-- Category filter bar -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-pill active" data-cat="all">
      All <span class="count" id="allCount">0</span>
    </button>
  </div>

  <!-- Loading skeleton -->
  <div class="skeleton" id="skeleton">
    <div class="skel-block" style="height:80px"></div>
    <div class="skel-block" style="height:200px"></div>
    <div class="skel-block" style="height:150px"></div>
  </div>

  <!-- No results -->
  <div class="no-results" id="noResults">
    <div style="font-size:2rem;margin-bottom:.5rem">🔍</div>
    No items match your search.
  </div>

  <!-- Category sections -->
  <div class="categories" id="categories"></div>

</div>

<footer class="footer" id="footer"></footer>

<script src="/trade/app.js"></script>
</body>
</html>
